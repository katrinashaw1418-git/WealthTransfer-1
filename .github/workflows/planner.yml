# Project verification gate.
#
# Runs the small set of self-contained scripts/test-*.ts checks that
# guard production-path invariants. Any non-zero exit from any job in
# this workflow blocks the build.
#
# Jobs:
#   - planner             — scripts/test-planner.ts. Wealth-planner
#                           compliance gate (Task #105). Needs Postgres
#                           via the PLANNER_DATABASE_URL secret; the
#                           script manages its own deterministic test
#                           fixtures and cleans them up via PK-tracked
#                           deletes, so the job needs only Node + npm
#                           install + the test:planner npm script.
#
#   - no-synthetic-data   — scripts/test-no-synthetic-portfolio-data.ts.
#                           Static tripwire for Task #132 — greps three
#                           production-path files and exits non-zero if
#                           a hardcoded numeric array of length >= 4 or
#                           the magic 0.25/0.25/0.25/0.25 equal-weight
#                           quartet is re-introduced into server/routes.ts.
#                           Pure source-grep — no DB, no secrets, no
#                           runtime — so it runs as its own fast,
#                           parallel job.
#
# Gating: runs on every push and pull request. A non-zero exit from any
# job blocks the build.
name: Verification gate

on:
  push:
  pull_request:

jobs:
  planner:
    runs-on: ubuntu-latest
    env:
      # CI-only safety-belt defaults; mirror scripts/test-planner.ts.
      NODE_ENV: test
      JWT_SECRET: ci-planner-test-secret
      # DATABASE_URL must be supplied via repository secrets so the script
      # can reach a Postgres instance. The script never touches production
      # data — its fixtures are scoped to the __planner_test_*__ prefix.
      DATABASE_URL: ${{ secrets.PLANNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Planner verification
        run: npm run test:planner

  no-synthetic-data:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: No-synthetic-data tripwire (Task #132)
        run: npx tsx scripts/test-no-synthetic-portfolio-data.ts
