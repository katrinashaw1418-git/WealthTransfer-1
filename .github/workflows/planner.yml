# Project verification gate.
#
# Runs the small set of self-contained scripts/test-*.ts checks that
# guard production-path invariants. Any non-zero exit from any job in
# this workflow blocks the build.
#
# Jobs:
#   - planner             — scripts/test-planner.ts. Wealth-planner
#                           compliance gate (Task #105). Needs Postgres
#                           via the PLANNER_DATABASE_URL secret; the
#                           script manages its own deterministic test
#                           fixtures and cleans them up via PK-tracked
#                           deletes, so the job needs only Node + npm
#                           install + the test:planner npm script.
#
#   - no-synthetic-data   — scripts/test-no-synthetic-portfolio-data.ts.
#                           Static tripwire for Task #132 — greps three
#                           production-path files and exits non-zero if
#                           a hardcoded numeric array of length >= 4 or
#                           the magic 0.25/0.25/0.25/0.25 equal-weight
#                           quartet is re-introduced into server/routes.ts.
#                           Pure source-grep — no DB, no secrets, no
#                           runtime — so it runs as its own fast,
#                           parallel job.
#
#   - ledger-leak-gate    — scripts/ci-ledger-leak-gate.ts (Task #193).
#                           Self-policing gate that snapshots the
#                           platform user's per-currency ledger SUM and
#                           ROW COUNT (and the same for every __-prefixed
#                           deterministic test user) before and after
#                           each scripts/test-*.ts run, and fails with a
#                           clear per-currency diff if anything was
#                           leaked. Catches the regression pattern fixed
#                           by tasks #158 and #187 — test scripts that
#                           forget to wrap the test body in try/finally
#                           with a per-user cleanup. Iterates ALL seven
#                           scripts/test-*.ts files (so test-planner and
#                           test-no-synthetic-portfolio-data are also
#                           covered with a leak snapshot, in addition to
#                           their dedicated jobs above which provide
#                           direct per-script failure attribution).
#                           Needs Postgres via PLANNER_DATABASE_URL.
#
#   - pre-launch-safety-strict
#                         — scripts/pre-launch-safety.ts --strict
#                           (Task #230). Early-warning PR gate that
#                           runs the same strict pre-launch safety
#                           rollup that scripts/predeploy-build.sh
#                           Stage 1 runs at Publish time (Task #151),
#                           but against the shared CI test DB
#                           (PLANNER_DATABASE_URL) instead of the
#                           production DB. Most SKIP regressions — a
#                           sub-script crashes at boot, a route
#                           handler isn't registered, a reconciliation
#                           service has no data to verify — surface
#                           identically against either DB and would
#                           otherwise only be caught at the moment an
#                           operator clicks Publish. Strict mode
#                           treats SKIP as a real failure, so a
#                           non-zero exit here blocks the PR before
#                           merge. This job COMPLEMENTS — does NOT
#                           replace — the production-DB gate in
#                           scripts/predeploy-build.sh: the deploy-
#                           time gate remains the authoritative final
#                           check against prod-shaped data; this job
#                           just stops the obvious regressions from
#                           ever reaching it.
#
# Gating: runs on every push and pull request. A non-zero exit from any
# job blocks the build.
name: Verification gate

on:
  push:
  pull_request:

jobs:
  planner:
    runs-on: ubuntu-latest
    env:
      # CI-only safety-belt defaults; mirror scripts/test-planner.ts.
      NODE_ENV: test
      JWT_SECRET: ci-planner-test-secret
      # DATABASE_URL must be supplied via repository secrets so the script
      # can reach a Postgres instance. The script never touches production
      # data — its fixtures are scoped to the __planner_test_*__ prefix.
      DATABASE_URL: ${{ secrets.PLANNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Planner verification
        run: npm run test:planner

  no-synthetic-data:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: No-synthetic-data tripwire (Task #132)
        run: npx tsx scripts/test-no-synthetic-portfolio-data.ts

  predeploy-gate-smoke:
    # Two checks that together pin the predeploy gate's externally-
    # visible contract:
    #   1. Pure-bash smoke test for scripts/predeploy-build.sh exit
    #      semantics (Task #180). Stubs npx/npm on PATH so the wrapper
    #      exercises every branch — NO-GO + report, crash without
    #      report, GO + report — without touching the live launch
    #      readiness gate. Guards the deploy wiring against regressions
    #      like surfacing a stale report on a crash, or shipping a GO
    #      build without an attached current-run report.
    #   2. Deploy-gate rollup regression (Task #225). Imports
    #      `alertingSection()` from scripts/go-no-go.ts with a stubbed
    #      dispatcher and asserts that --deploy-gate emits exactly one
    #      webhook-eligible alert per Publish (the rollup) and the
    #      default mode emits one per known source. Pins the on-call
    #      "one page per deploy" behaviour added by Task #218.
    runs-on: ubuntu-latest
    env:
      # Test harness only — JWT/DB are stubbed by `_bootstrap-stub-db`,
      # but server/auth.ts and server/db.ts still validate at module
      # init. The placeholder DB URL is never connected to because the
      # rollup test injects a fake dispatcher.
      NODE_ENV: test
      JWT_SECRET: ci-predeploy-gate-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Predeploy wrapper smoke test (Task #180)
        run: bash scripts/test-predeploy-gate.sh
      - name: Deploy-gate rollup regression (Task #225)
        run: npx tsx scripts/test-deploy-gate-rollup.ts

  ledger-leak-gate:
    runs-on: ubuntu-latest
    env:
      # CI-only safety-belt defaults; mirror the planner job above.
      NODE_ENV: test
      JWT_SECRET: ci-leak-gate-test-secret
      # Same DB as the planner job — the gate's resolvePlatformUserId()
      # mints / reuses a deterministic '__prelaunch_platform' user, and
      # every sub-script's fixtures are scoped to a __-prefixed user
      # whose state the gate snapshots and asserts is unchanged.
      DATABASE_URL: ${{ secrets.PLANNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Ledger-leak gate (Task #193, wired by Task #197)
        # Single-command PR-runner entrypoint. The wrapper script owns
        # the canonical --scripts list (so the workflow and a local
        # invocation stay identical) and forwards to
        # scripts/ci-ledger-leak-gate.ts. Iterates every
        # scripts/test-*.ts file EXCEPT test-planner.ts; see the
        # wrapper's header comment for why test-planner.ts is excluded
        # (already gated by the dedicated `planner` job above; carries
        # known compliance-coverage failures from Tasks #95/#96/#98
        # that would mis-attribute as ledger leaks). Exits non-zero
        # with the gate's per-currency diff output naming the leaking
        # script if any sub-script fails OR leaks ledger entries on
        # the platform user / on any __-prefixed test user.
        run: bash scripts/ci-ledger-leak-gate.sh

  pre-launch-safety-strict:
    # Early-warning PR gate (Task #230) for the same strict pre-launch
    # safety rollup that scripts/predeploy-build.sh Stage 1 runs at
    # Publish time (Task #151). Runs against the shared CI test DB
    # (PLANNER_DATABASE_URL) — NOT the production DB. The production-DB
    # run in scripts/predeploy-build.sh remains the authoritative final
    # gate against prod-shaped data; this job is a parallel, earlier
    # check whose job is to stop the obvious regressions (a sub-script
    # crashes at boot, a route handler isn't registered, a recon service
    # has no data to verify) from ever reaching deploy time. Strict mode
    # treats a SKIP as a real failure, so a non-zero exit here blocks
    # the PR before merge.
    runs-on: ubuntu-latest
    env:
      # CI-only safety-belt defaults; mirror the planner job above.
      NODE_ENV: test
      JWT_SECRET: ci-pre-launch-safety-strict-test-secret
      # Same CI DB as the planner / leak-gate jobs. The script's own
      # fixtures are scoped to the __prelaunch_ prefix and are cleaned
      # up via PK-tracked deletes on every run, so the shared test DB
      # is safe to point at.
      DATABASE_URL: ${{ secrets.PLANNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Pre-launch safety (strict) — early-warning PR gate (Task #230)
        # Same command scripts/predeploy-build.sh Stage 1 runs at
        # Publish time, just pointed at the CI test DB. A non-zero
        # exit (FAIL or SKIP under --strict) blocks the PR.
        run: npx tsx scripts/pre-launch-safety.ts --strict
