# Project verification gate.
#
# Runs the small set of self-contained scripts/test-*.ts checks that
# guard production-path invariants. Any non-zero exit from any job in
# this workflow blocks the build.
#
# Jobs:
#   - planner             — scripts/test-planner.ts. Wealth-planner
#                           compliance gate (Task #105). Needs Postgres
#                           via the PLANNER_DATABASE_URL secret; the
#                           script manages its own deterministic test
#                           fixtures and cleans them up via PK-tracked
#                           deletes, so the job needs only Node + npm
#                           install + the test:planner npm script.
#
#   - no-synthetic-data   — scripts/test-no-synthetic-portfolio-data.ts.
#                           Static tripwire for Task #132 — greps three
#                           production-path files and exits non-zero if
#                           a hardcoded numeric array of length >= 4 or
#                           the magic 0.25/0.25/0.25/0.25 equal-weight
#                           quartet is re-introduced into server/routes.ts.
#                           Pure source-grep — no DB, no secrets, no
#                           runtime — so it runs as its own fast,
#                           parallel job.
#
#   - ledger-leak-gate    — scripts/ci-ledger-leak-gate.ts (Task #193).
#                           Self-policing gate that snapshots the
#                           platform user's per-currency ledger SUM and
#                           ROW COUNT (and the same for every __-prefixed
#                           deterministic test user) before and after
#                           each scripts/test-*.ts run, and fails with a
#                           clear per-currency diff if anything was
#                           leaked. Catches the regression pattern fixed
#                           by tasks #158 and #187 — test scripts that
#                           forget to wrap the test body in try/finally
#                           with a per-user cleanup. Iterates ALL seven
#                           scripts/test-*.ts files (so test-planner and
#                           test-no-synthetic-portfolio-data are also
#                           covered with a leak snapshot, in addition to
#                           their dedicated jobs above which provide
#                           direct per-script failure attribution).
#                           Needs Postgres via PLANNER_DATABASE_URL.
#
# Gating: runs on every push and pull request. A non-zero exit from any
# job blocks the build.
name: Verification gate

on:
  push:
  pull_request:

jobs:
  planner:
    runs-on: ubuntu-latest
    env:
      # CI-only safety-belt defaults; mirror scripts/test-planner.ts.
      NODE_ENV: test
      JWT_SECRET: ci-planner-test-secret
      # DATABASE_URL must be supplied via repository secrets so the script
      # can reach a Postgres instance. The script never touches production
      # data — its fixtures are scoped to the __planner_test_*__ prefix.
      DATABASE_URL: ${{ secrets.PLANNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Planner verification
        run: npm run test:planner

  no-synthetic-data:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: No-synthetic-data tripwire (Task #132)
        run: npx tsx scripts/test-no-synthetic-portfolio-data.ts

  ledger-leak-gate:
    runs-on: ubuntu-latest
    env:
      # CI-only safety-belt defaults; mirror the planner job above.
      NODE_ENV: test
      JWT_SECRET: ci-leak-gate-test-secret
      # Same DB as the planner job — the gate's resolvePlatformUserId()
      # mints / reuses a deterministic '__prelaunch_platform' user, and
      # every sub-script's fixtures are scoped to a __-prefixed user
      # whose state the gate snapshots and asserts is unchanged.
      DATABASE_URL: ${{ secrets.PLANNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Ledger-leak gate (Task #193, wired by Task #197)
        # Single-command PR-runner entrypoint. The wrapper script owns
        # the canonical --scripts list (so the workflow and a local
        # invocation stay identical) and forwards to
        # scripts/ci-ledger-leak-gate.ts. Iterates every
        # scripts/test-*.ts file EXCEPT test-planner.ts; see the
        # wrapper's header comment for why test-planner.ts is excluded
        # (already gated by the dedicated `planner` job above; carries
        # known compliance-coverage failures from Tasks #95/#96/#98
        # that would mis-attribute as ledger leaks). Exits non-zero
        # with the gate's per-currency diff output naming the leaking
        # script if any sub-script fails OR leaks ledger entries on
        # the platform user / on any __-prefixed test user.
        run: bash scripts/ci-ledger-leak-gate.sh
